name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------------
  # Fast job: lint, type-check, and run the pytest suite (92 tests).
  # These tests use mocked Oracle connections (see tests/test_auth.py's
  # FakeConnection), so this job needs no real database and finishes in
  # seconds. This is the job that should gate every PR.
  # ---------------------------------------------------------------------
  python-tests:
    name: Lint, type-check, and test (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy type-check
        run: uv run mypy backend/src

      - name: Run pytest
        run: uv run pytest -v

  # ---------------------------------------------------------------------
  # Slower job: proves the SQL actually runs against a real Oracle
  # instance, not just that the Python layer mocks it correctly.
  # Boots gvenzl/oracle-free (built for exactly this CI use case),
  # then drives sqlplus *inside that container* via `docker exec`
  # instead of installing Oracle Instant Client on the runner.
  #
  # Note: db/tests/01_behavior_checks.sql is a set of SELECTs meant for
  # human eyeballing, not scripted assertions -- this job only proves
  # the build/seed/trigger/procedure SQL is syntactically and
  # referentially valid and executes without ORA- errors. It does not
  # assert business-logic correctness. See the follow-up suggestion
  # below if you want that too.
  # ---------------------------------------------------------------------
  database-build:
    name: Build & seed schema against real Oracle
    runs-on: ubuntu-latest
    env:
      # Ephemeral, CI-only container that never leaves the runner's
      # private Docker network and is destroyed at the end of the job --
      # not a credential worth protecting as a secret.
      CI_DB_PASSWORD: OracleCi_2026
      CI_DSN: localhost:1521/FREEPDB1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Oracle Database Free container
        run: |
          docker run -d --name oracle-free \
            -e ORACLE_PASSWORD="${CI_DB_PASSWORD}" \
            -p 1521:1521 \
            gvenzl/oracle-free:23-slim

      - name: Wait for database to be healthy
        run: |
          echo "Waiting for Oracle to report healthy (can take 1-2 min)..."
          timeout 300 bash -c '
            until [ "$(docker inspect -f "{{.State.Health.Status}}" oracle-free 2>/dev/null)" = "healthy" ]; do
              sleep 5
              echo "  ...still waiting"
            done
          '

      - name: Copy repository into the database container
        run: docker cp "${GITHUB_WORKSPACE}/." oracle-free:/workspace

      - name: Run Build.sql (drop -> create -> compile -> verify)
        run: |
          docker exec -w /workspace oracle-free \
            sqlplus -s "system/${CI_DB_PASSWORD}@${CI_DSN}" @Build.sql

      - name: Check for INVALID objects
        run: |
          docker exec -w /workspace oracle-free \
            sqlplus -s "system/${CI_DB_PASSWORD}@${CI_DSN}" <<'SQL'
          SET PAGESIZE 100
          SET FEEDBACK ON
          WHENEVER SQLERROR EXIT SQL.SQLCODE ROLLBACK;
          SELECT object_name, object_type, status
            FROM user_objects
           WHERE status != 'VALID';
          DECLARE
            v_invalid_count NUMBER;
          BEGIN
            SELECT COUNT(*) INTO v_invalid_count FROM user_objects WHERE status != 'VALID';
            IF v_invalid_count > 0 THEN
              RAISE_APPLICATION_ERROR(-20000, v_invalid_count || ' invalid object(s) after build');
            END IF;
          END;
          /
          EXIT;
          SQL

      - name: Load demo seed data
        run: |
          docker exec -w /workspace oracle-free \
            sqlplus -s "system/${CI_DB_PASSWORD}@${CI_DSN}" @scripts/seed_demo.sql

      - name: Run behavior checks
        run: |
          docker exec -w /workspace oracle-free \
            sqlplus -s "system/${CI_DB_PASSWORD}@${CI_DSN}" @db/tests/01_behavior_checks.sql

      - name: Show build/seed logs on failure
        if: failure()
        run: |
          docker exec -w /workspace oracle-free sh -c \
            'cat build_log.txt 2>/dev/null; echo ---; cat seed_demo_log.txt 2>/dev/null'

      - name: Stop container
        if: always()
        run: docker rm -f oracle-free